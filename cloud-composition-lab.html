<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一阶段 · 云的构图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b25;color:#e6edf0;font:15px/1.7 system-ui}main{max-width:1080px;margin:auto;padding:32px;display:grid;grid-template-columns:1fr 450px;gap:40px}h1{font-size:30px;line-height:1.25;margin:10px 0 20px}small{color:#9bc6d4;letter-spacing:.12em}p{color:#b9c9d0}label{display:block;margin:22px 0 6px}select,button,a{font:inherit}select,button{border:1px solid #4d6570;border-radius:7px;padding:10px;background:#203640;color:#edf4f6;width:100%}button{margin-top:22px;background:#bed8cc;color:#183128;cursor:pointer}a{color:#c1e5d5}iframe{display:block;width:450px;height:800px;border:0;background:#0c1721;border-radius:12px}#status{font-size:13px;color:#9fc0cc;min-height:48px;margin:16px 0}aside{position:sticky;top:20px;align-self:start}@media(max-width:820px){main{display:block;padding:20px}aside{margin-top:24px;position:static}iframe{width:100%;height:80vh;min-height:600px}}
</style>
<main><section>
<small>画面优化 / STAGE 01</small><h1>云的覆盖与构图</h1>
<p>远处补上柔和的云层，缩小过大的背景云；近处保留 puff 造型，将相邻云组织成松散的横向组合。</p>
<label for="layout">对照版本</label><select id="layout"><option value="composed">第一阶段 · 新布局</option><option value="legacy">调整前 · 原布局</option></select>
<label for="hour">时间</label><select id="hour"><option value="12">12:00 · 中午</option><option value="6">06:00 · 清晨</option><option value="17.59">17:35 · 黄昏</option><option value="0">00:00 · 夜间</option></select>
<label for="yaw">观察方向</label><select id="yaw"><option value="flight">正常飞行机位</option><option value="0">前方 · 0°</option><option value="45">右前 · 45°</option><option value="90">右侧 · 90°</option><option value="135">右后 · 135°</option><option value="180">后方 · 180°</option><option value="225">左后 · 225°</option><option value="270">左侧 · 270°</option><option value="315">左前 · 315°</option></select>
<button id="load">加载这一组对照</button><div id="status" role="status" aria-live="polite"></div>
<a id="fly" target="_blank" rel="noopener">打开当前版本，自由飞行 ↗</a>
<p>对照画面固定推进 24 帧，方便比较。自由飞行页可在 UI 中调整时间。本阶段先看云的疏密、留白和转向时的覆盖；海面与夜间亮度将在下一阶段调整。</p>
</section><aside><iframe id="view" title="第一阶段云布局预览"></iframe></aside></main>
<script type="module">
const $=id=>document.getElementById(id);let generation=0;
$('load').onclick=()=>{
 const id=++generation, started=performance.now();
 const params=new URLSearchParams({headlight:'off',reflectionstage:'previous',motionstage:'previous',tod:$('hour').value,cloudlayout:$('layout').value,colorstage:'previous',seastage:'previous',bgmotion:'spatial',bglook:'form',bgwrite:'replace',pufflook:'volume',sealook:'painted',bgq:'512',toon:'0',dof:'0',todspeed:'0'});
 $('fly').href='/?'+params;params.set('qa','frozen');
 // Start polling only after this document loads; never step the previous iframe.
 $('view').onload=()=>{
  if(id!==generation)return;
  const timer=setInterval(async()=>{
   if(id!==generation){clearInterval(timer);return;}
   const a=$('view').contentWindow.__porco;
   if(!a?.qa){if(performance.now()-started>120000){clearInterval(timer);$('status').textContent='加载超时，请重试。';}return;}
   clearInterval(timer);
   try{
    for(let i=0;i<24;i++){if(id!==generation)return;a.qa.step(1,1/60);await a.renderer.backend.device.queue.onSubmittedWorkDone();}
    const yaw=$('yaw').value;
    if(yaw!=='flight'){
     const r=Number(yaw)*Math.PI/180,c=a.camera.position;
     a.camera.lookAt(c.x+Math.sin(r)*1000,c.y+150,c.z-Math.cos(r)*1000);a.camera.updateMatrixWorld();a.renderer.render(a.scene,a.camera);
     await a.renderer.backend.device.queue.onSubmittedWorkDone();
    }
    if(id===generation)$('status').textContent='预览已就绪 · '+$('layout').selectedOptions[0].text+' · '+$('hour').selectedOptions[0].text;
   }catch(e){if(id===generation)$('status').textContent='预览失败：'+e.message;}
  },250);
 };
 $('view').src='/?'+params;$('status').textContent='正在加载云层并编译画面…';
};
$('load').click();
</script>
</html>
