<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四阶段 · 尾迹与风絮</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b25;color:#e6edf0;font:15px/1.7 system-ui}main{max-width:1080px;margin:auto;padding:32px;display:grid;grid-template-columns:1fr 450px;gap:40px}h1{font-size:30px;line-height:1.25;margin:10px 0 20px}small{color:#9bc6d4;letter-spacing:.12em}p{color:#b9c9d0}label{display:block;margin:22px 0 6px}select,button,a{font:inherit}select,button{border:1px solid #4d6570;border-radius:7px;padding:10px;background:#203640;color:#edf4f6;width:100%}button{margin-top:22px;background:#bed8cc;color:#183128;cursor:pointer}a{color:#c1e5d5}iframe{display:block;width:450px;height:800px;border:0;background:#0c1721;border-radius:12px}#status{font-size:13px;color:#9fc0cc;min-height:48px;margin:16px 0}aside{position:sticky;top:20px;align-self:start}@media(max-width:820px){main{display:block;padding:20px}aside{margin-top:24px;position:static}iframe{width:100%;height:80vh;min-height:600px}}
</style>
<main><section><small>画面优化 / STAGE 04</small><h1>尾迹与风絮</h1>
<p>尾迹缓慢漂移、扩散和消散，左右两条略有不同。风絮留在余光区域，夜间与穿云时更克制。</p>
<label for="layout">对照版本</label><select id="layout"><option value="refined">第四阶段 · 连续扰动</option><option value="previous">调整前 · 原尾迹与风絮</option></select>
<label for="hour">时间</label><select id="hour"><option value="12">12:00 · 中午</option><option value="17.59">17:35 · 黄昏</option><option value="0">00:00 · 夜间</option></select>
<label for="scenario">自动飞行</label><select id="scenario"><option value="turn">巡航 → 转弯 → 俯冲 → 恢复</option><option value="cruise">直线巡航 · 看轻微漂移</option><option value="cloud">穿云测试 · 固定放置一朵云</option></select>
<button id="load">加载 / 重播同一段飞行</button><button id="pause" disabled>暂停</button><div id="status" role="status" aria-live="polite"></div>
<a id="fly" target="_blank" rel="noopener">打开当前版本，自由飞行 ↗</a>
<p>演示共 8 秒模拟时间，新旧版本采用相同操纵节奏。可暂停观察；切换版本后点击“加载”。穿云场景仅用于此页测试，不改变正式场景的远端生成规则。</p>
</section><aside><iframe id="view" title="尾迹动态对照"></iframe></aside></main>
<script type="module">
const $=id=>document.getElementById(id);let generation=0,playing=false;
$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'暂停':'继续播放';};
$('load').onclick=()=>{
 const id=++generation,scenario=$('scenario').value,started=performance.now();playing=false;$('pause').disabled=true;
 const params=new URLSearchParams({headlight:'off',reflectionstage:'previous',tod:$('hour').value,motionstage:$('layout').value,cloudlayout:'composed',seastage:'refined',colorstage:'refined',bgmotion:'spatial',bglook:'form',bgwrite:'replace',pufflook:'volume',sealook:'painted',bgq:'512',toon:'0',dof:'0',todspeed:'0'});
 $('fly').href='/?'+params;params.set('qa','frozen');
 $('view').onload=()=>{
  if(id!==generation)return;
  const timer=setInterval(async()=>{
   if(id!==generation){clearInterval(timer);return;}
   const win=$('view').contentWindow,a=win.__porco;
   if(!a?.qa){if(performance.now()-started>120000){clearInterval(timer);$('status').textContent='加载超时，请重试。';}return;}
   clearInterval(timer);
   try{
    for(let i=0;i<24;i++){if(id!==generation)return;a.qa.step(1,1/60);await a.renderer.backend.device.queue.onSubmittedWorkDone();}
    if(scenario==='cloud'){
     const field=a.scene.getObjectByName('puff-field');const cloud=field.children.find(c=>c.userData.variant==='bank')??field.children[0];
     cloud.position.set(0,75,-170);
    }
    const canvas=a.renderer.domElement,box=canvas.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2;
    const pointer=(type,dx=0,dy=0)=>canvas.dispatchEvent(new win.PointerEvent(type,{pointerId:41,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:x+dx,clientY:y+dy,bubbles:true,cancelable:true}));
    let frame=0;playing=true;$('pause').disabled=false;$('pause').textContent='暂停';
    const tick=async()=>{
     if(id!==generation)return;
     if(playing&&frame<480){
      if(scenario==='turn'){
       if(frame===90){pointer('pointerdown');pointer('pointermove',65,-20);}
       if(frame===210)pointer('pointermove',-60,35);
       if(frame===330)pointer('pointerup');
      }
      a.qa.step(1,1/60);await a.renderer.backend.device.queue.onSubmittedWorkDone();frame++;
      $('status').textContent=`播放中 · ${(frame/60).toFixed(1)} / 8.0 秒`;
      if(frame===480){playing=false;$('pause').disabled=true;$('status').textContent='演示完成 · 可切换版本重播，或打开自由飞行';}
     }
     requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
   }catch(e){$('status').textContent='预览失败：'+e.message;}
  },250);
 };
 $('view').src='/?'+params;$('status').textContent='正在加载动态预览…';
};
$('load').click();
</script></html>
