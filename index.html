<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Porco Sunset Dogfight</title>
<style>
html,body{margin:0;height:100%;background:#1a1030;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
/* #frame carries #game's box so the HUD (position:absolute inside it) tracks the
   canvas rectangle instead of the viewport. */
#frame{position:relative;width:min(100vw,56.25vh * 1);height:100%;max-width:560px;aspect-ratio:9/16}
#game{width:100%;height:100%;touch-action:none}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="wrap"><div id="frame"><canvas id="game"></canvas></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
