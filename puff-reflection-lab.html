<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puff 倒影柔化对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b25;color:#e6edf0;font:15px/1.7 system-ui}main{max-width:1080px;margin:auto;padding:32px;display:grid;grid-template-columns:1fr 450px;gap:40px}h1{font-size:30px;line-height:1.25;margin:10px 0 20px}small{color:#9bc6d4;letter-spacing:.12em}p{color:#b9c9d0}label{display:block;margin:22px 0 6px}select,button,a{font:inherit}select,button{border:1px solid #4d6570;border-radius:7px;padding:10px;background:#203640;color:#edf4f6;width:100%}button{margin-top:22px;background:#bed8cc;color:#183128;cursor:pointer}a{color:#c1e5d5}iframe{display:block;width:450px;height:800px;border:0;background:#0c1721;border-radius:12px}#status{font-size:13px;color:#9fc0cc;min-height:48px;margin:16px 0}aside{position:sticky;top:20px;align-self:start}@media(max-width:820px){main{display:block;padding:20px}aside{margin-top:24px;position:static}iframe{width:100%;height:80vh;min-height:600px}}
</style>
<main><section>
<small>画面优化 / 云与水面</small><h1>Puff 倒影 · 更柔、更淡</h1>
<p>降低云倒影的混合强度，增加远处模糊与渐隐。补云同时检查天空和水面中的可见区域。</p>
<label for="layout">反射对照 · 就绪后可立即切换</label><select id="layout"><option value="refined">新版 · 柔化、减淡与远端渐隐</option><option value="previous">对照 · 上一版清晰倒影</option></select>
<label for="hour">时间</label><select id="hour"><option value="12" selected>12:00 · 中午</option><option value="6">06:00 · 清晨</option><option value="17.59">17:35 · 黄昏</option><option value="0">00:00 · 夜间</option></select>
<label for="yaw">观察方向</label><select id="yaw"><option value="puff" selected>固定近云 · 倒影对照</option><option value="flight">正常飞行机位</option><option value="away">背向太阳 / 月亮</option><option value="side">侧向太阳 / 月亮</option><option value="toward">朝向太阳 / 月亮</option></select>
<label for="quality">画质</label><select id="quality"><option value="high">高</option><option value="low">低</option></select>
<label for="alt">飞行高度</label><select id="alt"><option value="6">6m · 贴海观察飞机倒影</option><option value="60">60m · 巡航观察云层</option><option value="150">150m · 高空</option></select>
<label for="scatter">云散布 · 加载后生效</label><select id="scatter"><option value="refined">新版 · 屏幕外准备与云心遮挡</option><option value="previous">对照 · 原散布与透明远云</option></select>
<button id="load">加载所选时间与方向</button><div id="status" role="status" aria-live="polite"></div>
<a id="fly" target="_blank" rel="noopener">打开当前版本，自由飞行 ↗</a>
<p>默认使用固定近云机位，方便同一帧比较倒影。自由飞行使用实际散布：初始云带移至约 1.25–1.6km，近处已有云仍可正常飞入。</p>
</section><aside><iframe id="view" title="Puff 倒影柔化对照预览"></iframe></aside></main>
<script type="module">
const $=id=>document.getElementById(id);let generation=0,ready=null;
const renderVersion=async()=>{
 const a=ready;if(!a)return;
 const id=generation, on=$('layout').value==='refined';
 a.world.sea.setPuffReflectionSoft(on);
 a.world.updateBgView(a.qa.elapsed,a.camera.position,a.camera);
 a.world.sea.updateObjectReflection(a.scene,a.camera,a.qa.elapsed);
 a.renderer.render(a.scene,a.camera);await a.renderer.backend.device.queue.onSubmittedWorkDone();
 if(id!==generation)return;
 const url=new URL($('fly').href);url.searchParams.set('puffreflection',on?'refined':'previous');$('fly').href=url;
 $('status').textContent='预览已就绪 · '+$('layout').selectedOptions[0].text;
};
$('layout').onchange=()=>renderVersion().catch(e=>{$('status').textContent='预览失败：'+e.message;});
$('load').onclick=()=>{
 const id=++generation, started=performance.now();ready=null;
 const hour=$('hour').value,yaw=$('yaw').value,high=$('quality').value==='high';
 const params=new URLSearchParams({headlight:'off',reflectionstage:'refined',nightreflection:'refined',objectreflection:'on',puffreflection:$('layout').value,alt:$('alt').value,scatterstage:$('scatter').value,motionstage:'refined',tod:hour,cloudlayout:'composed',colorstage:'refined',seastage:'refined',bgmotion:'spatial',bglook:'form',bgwrite:'replace',pufflook:'volume',sealook:'painted',bgq:'512',toon:'0',dof:'0',todspeed:'0'});
 $('fly').href='/?'+params;params.set('qa','frozen');
 $('view').onload=()=>{
  if(id!==generation)return;
  const timer=setInterval(async()=>{
   if(id!==generation){clearInterval(timer);return;}
   const a=$('view').contentWindow.__porco;
   if(!a?.qa){if(performance.now()-started>120000){clearInterval(timer);$('status').textContent='加载超时，请重试。';}return;}
   clearInterval(timer);
   try{
    a.qa.setQuality(high);
    for(let i=0;i<90;i++){if(id!==generation)return;a.qa.step(1,1/60);await a.renderer.backend.device.queue.onSubmittedWorkDone();}
    if(yaw==='puff'){
     const cloud=a.scene.getObjectByName('puff-field').children.find(c=>c.visible);
     cloud.position.set(0,140,-350);cloud.material.userData.edgeFade.value=1;
     a.camera.position.set(0,70,200);a.camera.lookAt(0,0,-350);a.camera.updateMatrixWorld();
    }else if(yaw!=='flight'){
     const sun=a.qa.getSun(),offset=yaw==='away'?180:yaw==='side'?90:0;
     const r=(sun.azimuthDeg+(sun.elevationDeg<0?180:0)+offset)*Math.PI/180,c=a.camera.position;
     a.camera.lookAt(c.x+Math.sin(r)*1000,c.y-200,c.z-Math.cos(r)*1000);a.camera.updateMatrixWorld();
    }
    if(id!==generation)return;ready=a;await renderVersion();
   }catch(e){if(id===generation)$('status').textContent='预览失败：'+e.message;}
  },250);
 };
 $('view').src='/?'+params;$('status').textContent='正在加载反射预览…';
};
$('load').click();
</script></html>
