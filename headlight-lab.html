<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第六阶段 · 夜航前照灯</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b25;color:#e6edf0;font:15px/1.7 system-ui}main{max-width:1080px;margin:auto;padding:32px;display:grid;grid-template-columns:1fr 450px;gap:40px}h1{font-size:30px;line-height:1.25;margin:10px 0 20px}small{color:#9bc6d4;letter-spacing:.12em}p{color:#b9c9d0}label{display:block;margin:16px 0 6px}select,button,a{font:inherit}select,button{border:1px solid #4d6570;border-radius:7px;padding:10px;background:#203640;color:#edf4f6;width:100%}button{margin-top:22px;background:#bed8cc;color:#183128;cursor:pointer}a{color:#c1e5d5}iframe{display:block;width:450px;height:800px;border:0;background:#0c1721;border-radius:12px}#status{font-size:13px;color:#9fc0cc;min-height:48px;margin:16px 0}aside{position:sticky;top:20px;align-self:start}@media(max-width:820px){main{display:block;padding:20px}aside{margin-top:24px;position:static}iframe{width:100%;height:80vh;min-height:600px}}
</style>
<main><section>
<small>画面优化 / STAGE 06</small><h1>夜航前照灯</h1>
<p>淡暖色光束随飞机转动；靠近云层和海面时，留下柔和的局部亮斑。</p>
<label for="mode">灯光 · 就绪后立即切换</label><select id="mode"><option value="auto">自动 · 夜间亮灯</option><option value="on">开启</option><option value="off">关闭 · 同帧对照</option></select>
<label for="scenario">场景</label><select id="scenario"><option value="cruise">巡航 · 空气光束</option><option value="low">低空 · 海面光斑</option><option value="cloud">接近云层 · 局部照亮</option></select>
<label for="hour">时间</label><select id="hour"><option value="0">00:00 · 夜间</option><option value="6">06:00 · 清晨</option><option value="12">12:00 · 中午</option></select>
<label for="viewpoint">机位</label><select id="viewpoint"><option value="chase">跟随飞机</option><option value="side">侧后方 · 看光束方向</option></select>
<label for="quality">画质</label><select id="quality"><option value="high">高</option><option value="low">低</option></select>
<button id="load">加载所选场景</button><div id="status" role="status" aria-live="polite"></div>
<a id="fly" target="_blank" rel="noopener">打开当前灯光设置，自由飞行 ↗</a>
<p>灯光开关保持同一帧，方便观察差别。正式飞行时可在右上角 UI 调整前照灯；接近云层场景仅在此页放置一朵测试云。</p>
</section><aside><iframe id="view" title="第六阶段前照灯预览"></iframe></aside></main>
<script type="module">
const $=id=>document.getElementById(id);let generation=0,ready=null;
const renderMode=async()=>{
 const a=ready;if(!a)return;const id=generation,mode=$('mode').value;
 a.qa.setHeadlight(mode);a.renderer.render(a.scene,a.camera);await a.renderer.backend.device.queue.onSubmittedWorkDone();
 if(id!==generation)return;
 const url=new URL($('fly').href);url.searchParams.set('headlight',mode);$('fly').href=url;
 $('status').textContent='预览已就绪 · '+$('mode').selectedOptions[0].text;
};
$('mode').onchange=()=>renderMode().catch(e=>{$('status').textContent='预览失败：'+e.message;});
$('load').onclick=()=>{
 const id=++generation,started=performance.now();ready=null;
 const scenario=$('scenario').value,viewpoint=$('viewpoint').value,high=$('quality').value==='high';
 const params=new URLSearchParams({headlight:$('mode').value,alt:scenario==='low'?'12':'60',tod:$('hour').value,reflectionstage:'refined',motionstage:'refined',cloudlayout:'composed',colorstage:'refined',seastage:'refined',bgmotion:'spatial',bglook:'form',bgwrite:'replace',pufflook:'volume',sealook:'painted',bgq:'512',toon:'0',dof:'0',todspeed:'0'});
 $('fly').href='/?'+params;params.set('qa','frozen');
 $('view').onload=()=>{
  if(id!==generation)return;
  const timer=setInterval(async()=>{
   if(id!==generation){clearInterval(timer);return;}
   const a=$('view').contentWindow.__porco;
   if(!a?.qa){if(performance.now()-started>120000){clearInterval(timer);$('status').textContent='加载超时，请重试。';}return;}
   clearInterval(timer);
   try{
    a.qa.setQuality(high);
    for(let i=0;i<48;i++){if(id!==generation)return;a.qa.step(1,1/60);await a.renderer.backend.device.queue.onSubmittedWorkDone();}
    const p=a.game.pose();
    if(scenario==='cloud'){
     const cloud=a.scene.getObjectByName('puff-field').children[0];cloud.position.set(p.x,p.y+10,p.z-85);cloud.material.userData.edgeFade.value=1;
    }
    if(viewpoint==='side'){a.camera.position.set(p.x+75,p.y+20,p.z+65);a.camera.lookAt(p.x,p.y,p.z-25);a.camera.updateMatrixWorld();}
    if(id!==generation)return;ready=a;await renderMode();
   }catch(e){if(id===generation)$('status').textContent='预览失败：'+e.message;}
  },250);
 };
 $('view').src='/?'+params;$('status').textContent='正在加载夜航预览…';
};
$('load').click();
</script></html>
